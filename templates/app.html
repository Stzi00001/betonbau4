<title>Betonbau 4 Lernplattform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Schalplan-Raster – Themen als Bauteilkarten, Werkzeuge als Positionskacheln, Rechner im Zwei-Spalten-Statikblatt */
:root{
  --bg:#e8eae9; --surface:#f7f8f7; --line:#c9cecc; --ink:#172025; --muted:#56625f;
  --accent:#e2a90a; --accent-ink:#1b1400; --link:#1d5ea8; --good:#2f7d4f; --bad:#b4372e;
  --stage:#0d1630; --stage-2:#16244d; --stage-line:#3b5196; --stage-ink:#eef2ff; --gold:#f2c14e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"STIX Two Text","Cambria","Georgia",serif;
  --ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121618; --surface:#1b2124; --line:#334044; --ink:#e4e9e7; --muted:#9aa7a3;
  --accent:#f0bb2a; --accent-ink:#1b1400; --link:#7fb3f0; --good:#5cbf84; --bad:#ec7a6f;
  --stage:#070d20; --stage-2:#111d40; --stage-line:#3b5196; --stage-ink:#eef2ff; --gold:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121618; --surface:#1b2124; --line:#334044; --ink:#e4e9e7; --muted:#9aa7a3;
  --accent:#f0bb2a; --accent-ink:#1b1400; --link:#7fb3f0; --good:#5cbf84; --bad:#ec7a6f;
  --stage:#070d20; --stage-2:#111d40; --stage-line:#3b5196; --stage-ink:#eef2ff; --gold:#f2c14e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
/* Bedienelemente in serifenloser Schrift, Lerninhalte in Serifenschrift wie im Skript */
button,input,select,.label,.chip,.btn,.back,.seg,.tabs,.fld,.res .u,.stage,.note .mono,small{font-family:var(--ui)}
.step h3,.rw-step h4,.formel h3{font-family:var(--body)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.top h1{font-size:clamp(40px,8vw,72px);text-transform:uppercase}
.top h1 span{background:var(--accent);color:var(--accent-ink);padding:0 .12em}
.top .meta{color:var(--muted);max-width:34ch}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.back{background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;color:var(--ink)}
.back:hover{border-color:var(--ink)}

/* Themen */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.topic{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;min-height:190px;align-content:start}
.topic:hover{border-color:var(--ink)}
.topic .nr{font-family:var(--display);font-size:56px;line-height:.8;color:var(--accent)}
.topic h2{font-size:30px}
.topic p{margin:0;color:var(--muted);font-size:15px}
.topic.leer{background:transparent;border-style:dashed;cursor:default}
.topic.leer .nr{color:var(--line)}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:1px solid currentColor;width:max-content}
.chip.warn{color:var(--accent)}
.note{border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;margin:0 0 20px;font-size:15px}

/* Werkzeuge */
.thead{display:grid;gap:8px;margin-bottom:22px}
.thead h2{font-size:clamp(34px,6vw,52px)}
.thead p{margin:0;color:var(--muted);max-width:65ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tool{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:start}
.tool:hover{border-color:var(--ink)}
.tool svg{grid-row:span 2;width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.6}
.tool h3{font-size:24px}
.tool p{margin:0;font-size:14px;color:var(--muted)}

/* Karteikarten */
.cards-wrap{display:grid;gap:16px;max-width:640px;margin:0 auto}
.flip{perspective:1200px;height:300px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:24px;display:grid;place-content:center;text-align:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.face.back .label{color:var(--accent)}
.face h3{font-size:clamp(28px,6vw,40px)}
.face p{margin:0;font-size:18px;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.teilseg{margin-bottom:14px;flex-wrap:wrap;max-width:100%}
#ue-sel{flex-wrap:wrap;max-width:100%}
#ue-sel button{flex:1 1 180px;min-width:0;padding:8px 10px;line-height:1.25}
.teilseg button{flex:1 1 auto;white-space:nowrap}
.fgruppe{font-family:var(--body);font-size:20px;margin:22px 0 6px}
.fgruppe:first-of-type{margin-top:4px}
.formel h3 .gl{color:var(--accent);font-variant-numeric:tabular-nums}
.vids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.vid{border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;text-decoration:none}
.vid:hover{background:var(--accent);color:var(--accent-ink)}
a.btn.pdf{text-decoration:none;display:inline-block}
.boxes{display:flex;gap:6px}
.boxes span{flex:1;text-align:center;border:1px solid var(--line);border-radius:4px;padding:4px 0;font-size:13px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}

/*__QUIZ_CSS__*/

/* Zuordnen */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mitem{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;text-align:left}
.mitem.a{font-weight:600}
.mitem.sel{border-color:var(--link);box-shadow:0 0 0 2px var(--link)}
.mitem.done{opacity:.35;cursor:default;border-style:dashed}
.mitem.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Formeln */
.formeln{display:grid;gap:0;border-top:2px solid var(--ink)}
.formel{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.formel .f{font-size:18px;overflow-x:auto;overflow-y:hidden;min-width:0;padding-block:2px}
.formel .e{grid-column:2;color:var(--muted);font-size:14px}
.formel h3{font-family:var(--body);font-size:15px;font-weight:700}

/* Mindmap */
.mm-root{display:grid;justify-items:center;gap:0}
.mm-center{background:var(--ink);color:var(--bg);font-family:var(--display);font-size:32px;padding:10px 28px;border-radius:999px}
.mm-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;margin-top:28px;position:relative}
.mm-branches::before{content:"";position:absolute;top:-28px;left:50%;height:16px;border-left:2px solid var(--ink)}
.mm-branch{border-top:4px solid var(--accent);background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:14px 14px 16px}
.mm-branch>details>summary{font-family:var(--display);font-size:24px;font-weight:700}
.mm details{margin:0}
.mm summary{cursor:pointer;list-style:none;padding:3px 0}
.mm summary::-webkit-details-marker{display:none}
.mm summary::before{content:"+";display:inline-block;width:18px;font-family:var(--mono);color:var(--muted)}
.mm details[open]>summary::before{content:"−"}
.mm .leaf{padding:3px 0 3px 18px}
.mm ul{list-style:none;margin:2px 0 4px 8px;padding-left:12px;border-left:1px solid var(--line)}
.mm li{position:relative}
.mm li::before{content:"";position:absolute;left:-12px;top:15px;width:9px;border-top:1px solid var(--line)}

/* Rechner */
.calc{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.panel h3{font-size:22px}
.fld{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;font-size:15px}
.fld input,.fld select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px}
.fld small{grid-column:1/-1;color:var(--muted);font-size:13px;margin-top:-4px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.res{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:2px}
.res .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.res .u{font-size:13px;color:var(--muted)}
.res.ok{border-left:4px solid var(--good)}
.res.bad{border-left:4px solid var(--bad)}
.util{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.util i{display:block;height:100%}
.xsec{width:100%;max-width:360px;height:auto}
.xsec .conc{fill:var(--line);stroke:var(--ink);stroke-width:1.5}
.xsec .wall{fill:var(--accent);opacity:.35}
.xsec .mid{fill:none;stroke:var(--ink);stroke-dasharray:6 4;stroke-width:1.3}
.xsec .bar{fill:var(--ink)}
.xsec text{fill:var(--ink);font-family:var(--mono);font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.rg{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;background:var(--surface)}
table.rg th,table.rg td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rg th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
table.rg td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rg td.fx{font-size:14px;color:var(--muted);white-space:nowrap}
table.rg tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 40%,var(--surface))}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg);border-radius:4px 4px 0 0}

@media (max-width:760px){
  .calc{grid-template-columns:1fr}
}
@media (max-width:560px){
  .match{grid-template-columns:1fr 1.3fr;gap:8px}
  .mitem{padding:8px 10px;font-size:14px}
  .formel{grid-template-columns:1fr}.formel .e{grid-column:1}
}
mjx-container{font-size:105%!important}mjx-container[display="true"]{margin:0!important}
.mitem.a mjx-container,.ans mjx-container{font-size:110%!important}
.face mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
/* Übungsaufgaben */
.ue-top{display:grid;gap:14px;margin-bottom:18px}
.ue-text{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;font-size:17px;max-width:75ch}
.ue-steps{display:grid;gap:12px;counter-reset:st}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.step h3{font-family:var(--body);font-size:17px;display:flex;gap:10px;align-items:baseline}
.step h3::before{counter-increment:st;content:counter(st);font-family:var(--display);font-size:26px;color:var(--accent);line-height:1}
.step p{margin:0;color:var(--muted);font-size:15px;max-width:70ch}
.ask{display:grid;grid-template-columns:minmax(90px,auto) 130px auto 24px;gap:8px 10px;align-items:center;justify-content:start}
.ask input{padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;width:100%}
.ask input.ok{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.ask input.no{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ask .mk{font-weight:700}
.ask .mk.ok{color:var(--good)}.ask .mk.no{color:var(--bad)}
.ask .unit{color:var(--muted);font-size:14px}
.sol{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px;overflow-x:auto;overflow-y:hidden}
.sol .gen{color:var(--muted)}
.sol .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:560px){.ask{grid-template-columns:1fr 110px 24px}.ask .unit{grid-column:2;margin-top:-6px;font-size:12px}}
/* Rechenweg */
.rw{margin-top:22px;border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:12px}
.rw-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rw-head h3{font-size:30px}
.rw-doc{display:grid;gap:0;counter-reset:rw}
.rw-step{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.rw-step h4{margin:0;font-size:17px;display:flex;gap:10px;align-items:baseline}
.rw-n{font-family:var(--body);font-weight:700;font-size:20px;color:var(--accent);line-height:1;min-width:1.2em}
.rw-step p{margin:0;color:var(--muted);font-size:15px;max-width:75ch}
.rw-f,.rw-e{display:grid;gap:6px;overflow-x:auto;overflow-y:hidden;padding-left:calc(1.2em + 10px)}
.rw-f{color:var(--muted)}
.rw-e{border-left:3px solid var(--accent);padding-left:12px;margin-left:calc(1.2em + 10px)}
#printarea{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  :root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#444;--line:#bbb;--accent:#b07d00;color-scheme:light}
  body{background:#fff!important;padding:0!important}
  body.printing > *:not(#printarea){display:none!important}
  body.printing #printarea{display:block;font-size:11pt;color:#111}
  #printarea .pr-head{display:flex;justify-content:space-between;font-size:9pt;color:#555;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:10px}
  #printarea .pr-title{font-family:var(--body);font-weight:700;font-size:20pt;margin:0 0 10px}
  #printarea .pr-in{border-collapse:collapse;margin-bottom:8px;font-size:10pt}
  #printarea .pr-in th,#printarea .pr-in td{border-bottom:1px solid #ccc;padding:3px 10px 3px 0;text-align:left}
  #printarea .pr-in td.n{text-align:right;font-family:var(--mono)}
  #printarea .rw-step{break-inside:avoid;padding:8px 0}
  #printarea .rw-f,#printarea .rw-e{overflow:visible}
  #printarea .pr-foot{font-size:8.5pt;color:#555;margin-top:12px}
  mjx-container svg g,mjx-container svg path,mjx-container svg use{stroke:none!important;stroke-width:0!important}
}
/* Bearbeitungsmodus */
.foot{margin-top:28px;text-align:right}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-family:var(--ui);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.chip.ok{color:var(--good)}
.fld.wide{grid-template-columns:1fr}
.fld textarea,.ed-suche,.mm-form input,.fld.wide input,.fld.wide select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px}
.fld textarea{resize:vertical;min-height:4.5em;line-height:1.45}
.fld textarea.mono{font-family:var(--mono);font-size:14px}
.ed-setup{max-width:720px}
.ed-setup ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:16px}
.ed-setup p{margin:0}
.ed-hinweis,.ed-tipp{color:var(--muted);font-size:14px;font-family:var(--ui);margin:6px 0 12px}
.ed-msg{font-family:var(--ui);font-size:14px;color:var(--muted)}
.ed-msg.fehler{color:var(--bad)}
.ed-tabs{flex-wrap:wrap;max-width:100%}
.ed-tabs button{flex:1 1 auto;white-space:nowrap}
.ed-tools{margin-bottom:12px}
.ed-suche{max-width:260px;flex:1 1 160px}
.ed-list{display:grid;gap:8px}
.ed-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:12px;min-width:0}
.ed-item.open{border-color:var(--ink)}
.ed-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ed-txt{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.ed-t{font-weight:600}
.ed-s{color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ed-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ed-btns{display:flex;gap:6px;flex-wrap:wrap}
.ed-btns .btn{padding:6px 12px;font-size:14px}
.ed-form{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.ed-prev{background:var(--bg);border-radius:4px;padding:8px 10px;margin-top:4px;overflow-x:auto;font-size:16px}
.ed-video{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 12px;display:grid;gap:8px;min-width:0}
.ed-video legend{font-family:var(--ui);font-size:14px;color:var(--muted);padding:0 4px}
.ed-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-weg{margin-top:18px}
.ed-weg summary{cursor:pointer;font-family:var(--ui);color:var(--muted);padding:6px 0}
.ed-weg .ed-item{margin-top:6px;opacity:.8}
.mm-edtree,.mm-edtree ul{list-style:none;margin:0;padding-left:0}
.mm-edtree ul{padding-left:18px;border-left:1px solid var(--line);margin-left:6px}
.mm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0}
.mm-btns{display:inline-flex;gap:10px;margin-left:auto}
.mm-btns .linkbtn{font-size:13px}
.mm-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;padding:4px 0}
.mm-form input{flex:1 1 200px;width:auto}

window.__texQ = [];

  if (!el) return;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else window.__texQ.push(el);
}
window.MathJax = {
  tex: {inlineMath: [["$", "$"]], displayMath: [], processEscapes: false},
  svg: {fontCache: "global"},
  options: {enableMenu: false},
  startup: {ready(){ MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => window.__texQ.splice(0).forEach(e => document.contains(e) && tex(e))); }}
};

<script>
const DATA = /*__CONTENT__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem("bb4:" + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("bb4:" + k, JSON.stringify(v)); } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (x, d = 2) => Number.isFinite(x) ? x.toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d}) : "–";

const ICONS = {
  quiz: '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"/><path d="M17 17a5 5 0 1 1 7 4.6c-1.4.6-2 1.6-2 3V26"/><circle cx="22" cy="31" r=".8" fill="currentColor"/></svg>',

  mindmap: '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="5"/><circle cx="7" cy="9" r="3"/><circle cx="37" cy="9" r="3"/><circle cx="7" cy="35" r="3"/><circle cx="37" cy="35" r="3"/><path d="M18 18L9.5 11M26 18l8.5-7M18 26l-8.5 7M26 26l8.5 7"/></svg>',
  formeln: '<svg viewBox="0 0 44 44"><path d="M10 9h24M10 35h24M28 9L16 22l12 13"/></svg>',
  uebung: '<svg viewBox="0 0 44 44"><path d="M8 36l3-10L29 8l7 7-18 18z"/><path d="M26 11l7 7M8 36l10-3"/><path d="M24 38h14"/></svg>',
  zuordnen: '<svg viewBox="0 0 44 44"><rect x="5" y="8" width="12" height="8" rx="1"/><rect x="5" y="28" width="12" height="8" rx="1"/><rect x="27" y="8" width="12" height="8" rx="1"/><rect x="27" y="28" width="12" height="8" rx="1"/><path d="M17 12l10 20M17 32l10-20"/></svg>'
};

function toolsFor(t){
  const list = [];
  if (t.quiz?.length) list.push({id:"quiz", name:"Wer wird Millionär?", desc:`${t.quiz.length} Fragen im Pool, 15 Stufen, 3 Joker`});
  if (t.karten?.length) list.push({id:"karten", name:"Karteikarten", desc:`${t.karten.length} Karten mit Lernfächern`});
  if (t.aufgaben?.length) list.push({id:"uebung", name:"Übungsaufgaben", desc:`${t.aufgaben.length} Aufgaben mit Zufallswerten und Lösungsweg`});
  if (t.rechner) list.push({id:"rechner", name:"Bemessungstool", desc:"Rechner mit Rechengang als Tabelle"});
  if (t.mindmap) list.push({id:"mindmap", name:"Mindmap", desc:"Aufklappbare Themenübersicht"});
  if (t.formeln?.length) list.push({id:"formeln", name:"Formelsammlung", desc:`${t.formeln.length} Formeln mit Erläuterung`});
  if (t.paare?.length) list.push({id:"zuordnen", name:"Zuordnen", desc:`${t.paare.length} Begriffe zu Bedeutungen`});
  return list;
}

/* ---------- Routing ---------- */
function go(hash){ if (location.hash.slice(1) === hash) render(); else location.hash = hash; }
window.addEventListener("hashchange", render);

function render(){
  const h = location.hash.slice(1);
  const [tid, tool] = h.split("-");
  const t = DATA.themen.find(x => x.id === tid);
  const app = $("#app");
  if (h === "bearbeiten"){ Einrichtung(app); window.scrollTo(0,0); return; }
  if (!t){ app.innerHTML = home(); bindHome(); window.scrollTo(0,0); tex(app); return; }
  if (!tool){ app.innerHTML = topicView(t); bindTopic(t); window.scrollTo(0,0); tex(app); return; }
  app.innerHTML = header(t, tool) + '<div id="tool"></div>';
  $("#back").onclick = () => go(t.id);
  ({bearbeiten:Editor, uebung:Uebung, quiz:Quiz, karten:Karten, rechner:Rechner, mindmap:Mindmap, formeln:Formeln, zuordnen:Zuordnen}[tool] || (()=>{}))(t, $("#tool"));
  window.scrollTo(0,0); tex($("#app"));
}

function home(){
  const cards = DATA.themen.map(t => `
    <button class="topic" data-id="${t.id}">
      <span class="nr">${String(t.nr).padStart(2,"0")}</span>
      <h2>${esc(t.titel)}</h2>
      <p>${esc(t.untertitel)}</p>
      <span class="row">${toolsFor(t).length ? `<span class="label">${toolsFor(t).length} Lernangebote</span>` : '<span class="label">Inhalte folgen</span>'}${t.status === "vorläufig" ? '<span class="chip warn">vorläufig</span>' : t.status === "teilweise" ? '<span class="chip warn">teilweise abgeglichen</span>' : ""}</span>
    </button>`).join("");
  return `
  <header class="top"><h1>Betonbau <span>4</span></h1>
    <p class="meta">Digitale Lernangebote zu den Themen der Vorlesung. Thema wählen, dann Lernform wählen.</p></header>
  <div class="topics">${cards}</div>
  <p class="foot"><button class="linkbtn" id="ed-link" type="button">${GH.token() ? "Bearbeitungsmodus · verbunden" : "Bearbeitungsmodus"}</button></p>`;
}
function bindHome(){ document.querySelectorAll(".topic[data-id]").forEach(b => b.onclick = () => go(b.dataset.id)); $("#ed-link").onclick = () => go("bearbeiten"); }

function topicView(t){
  return `
  <div class="crumbs" style="margin-top:20px"><button class="back" id="home">← Alle Themen</button><span class="label">Betonbau 4 · Thema ${t.nr}</span></div>
  <div class="thead"><h2>${esc(t.titel)}</h2><p>${esc(t.untertitel)}</p></div>
  ${t.statusText && t.status !== "fertig" ? `<p class="note">${esc(t.statusText)}</p>` : ""}
  <div class="tools">${toolsFor(t).map(x => `
    <button class="tool" data-tool="${x.id}">${ICONS[x.id]}<h3>${x.name}</h3><p>${x.desc}</p></button>`).join("")}
  </div>
  ${GH.token() && !IN_FRAME ? `<div class="row" style="margin-top:20px"><button class="btn ghost" id="ed-open" type="button">✎ Inhalte bearbeiten</button></div>` : ""}`;
}
function bindTopic(t){
  $("#home").onclick = () => go("");
  document.querySelectorAll(".tool").forEach(b => b.onclick = () => go(t.id + "-" + b.dataset.tool));
  if ($("#ed-open")) $("#ed-open").onclick = () => go(t.id + "-bearbeiten");
}
function header(t, tool){
  const name = tool === "bearbeiten" ? "Inhalte bearbeiten" : (toolsFor(t).find(x => x.id === tool)?.name || "");
  return `<div class="crumbs" style="margin-top:20px"><button class="back" id="back">← ${esc(t.titel)}</button></div>
  <div class="thead"><span class="label">Thema ${t.nr} · ${esc(t.titel)}</span><h2>${name}</h2></div>`;
}

/* ---------- Übungsaufgaben mit Zufallswerten ---------- */
/*__ENGINE_JS__*/
function Uebung(t, el){
  let ai = 0, ctx, digits;
  function gen(){
    const a = t.aufgaben[ai];
    ctx = {...MATHCTX}; digits = {};
    drawParams(a.params, ctx, digits);
    compute(a.schritte, ctx, digits);
    draw();
  }
  function draw(){
    const a = t.aufgaben[ai];
    const seg = t.aufgaben.length > 1 ? `<div class="seg" id="ue-sel">${t.aufgaben.map((x, k) => `<button data-k="${k}" class="${k===ai?"on":""}">${esc(x.titel)}</button>`).join("")}</div>` : "";
    el.innerHTML = `<div class="ue-top">${seg}
      <div class="ue-text">${fill(a.text, ctx, digits)}</div>
      <div class="row"><button class="btn" id="ue-new">Neue Zahlen</button>${pdfLinks(t, "uebungsblatt")}<button class="btn ghost" id="ue-check">Alles prüfen</button><button class="btn ghost" id="ue-all">Alle Lösungen zeigen</button><span class="score label" id="ue-score"></span></div>
    </div>
    <div class="ue-steps">${a.schritte.filter(st => cond(st, ctx)).map((st, i) => {
      const asks = (st.werte || []).filter(w => w.frage && cond(w, ctx));
      return `<section class="step" data-i="${i}"><h3>${esc(st.titel)}</h3>${st.text ? `<p>${fill(st.text, ctx, digits)}</p>` : ""}
        ${asks.map(w => `<div class="ask"><label for="ue-${w.id}">$${w.label}$</label><input id="ue-${w.id}" data-id="${w.id}" inputmode="decimal" autocomplete="off"><span class="unit">${esc(w.einheit || "")}</span><span class="mk" id="mk-${w.id}"></span></div>`).join("")}
        <div class="row">${asks.length ? `<button class="btn ghost ue-chk">Prüfen</button>` : ""}<button class="btn ghost ue-sol">Lösung zeigen</button></div>
        <div class="sol" hidden>
          <span class="lbl">Ansatz</span>${lines(st.formel, ctx).map(f => `<div class="gen">$\displaystyle ${fill(f, ctx, digits)}$</div>`).join("")}
          <span class="lbl">Eingesetzt</span>${lines(st.einsetzen, ctx).map(f => `<div>$\displaystyle ${fill(f, ctx, digits)}$</div>`).join("")}
        </div></section>`; }).join("")}</div>
    <p class="note" style="margin-top:18px">Toleranz beim Prüfen: ±2 %. ${a.teil === "1" ? "Lösungsweg nach Skript Teil 1, Gleichungsnummern wie im Skript." : "Lösungsweg vorläufig nach DIN EN 1992-1-1 + NA, wird an Gliederung und Schreibweise des Skripts angepasst."}</p>`;
    el.querySelectorAll("#ue-sel button").forEach(b => b.onclick = () => { ai = +b.dataset.k; gen(); });
    $("#ue-new").onclick = gen;
    $("#ue-all").onclick = () => el.querySelectorAll(".sol").forEach(s => s.hidden = false);
    $("#ue-check").onclick = () => el.querySelectorAll(".step").forEach(check);
    el.querySelectorAll(".ue-chk").forEach(b => b.onclick = () => check(b.closest(".step")));
    el.querySelectorAll(".ue-sol").forEach(b => b.onclick = () => { const s = b.closest(".step").querySelector(".sol"); s.hidden = !s.hidden; b.textContent = s.hidden ? "Lösung zeigen" : "Lösung ausblenden"; });
    el.querySelectorAll(".ask input").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") check(inp.closest(".step")); }));
    tex(el);
  }
  function check(step){
    step.querySelectorAll(".ask input").forEach(inp => {
      const id = inp.dataset.id, soll = ctx[id], mk = $("#mk-" + id);
      const raw = inp.value.trim().replace(/\s/g, "").replace(",", ".");
      inp.classList.remove("ok", "no"); mk.className = "mk"; mk.textContent = "";
      if (!raw) return;
      const ist = parseFloat(raw);
      const good = Number.isFinite(ist) && Math.abs(ist - soll) <= Math.max(Math.abs(soll) * 0.02, 0.005);
      inp.classList.add(good ? "ok" : "no"); mk.classList.add(good ? "ok" : "no"); mk.textContent = good ? "✓" : "✗";
    });
    const all = el.querySelectorAll(".ask input"), right = el.querySelectorAll(".ask input.ok").length;
    $("#ue-score").textContent = `${right} / ${all.length} richtig`;
  }
  gen();
}

/* ---------- Videolinks mit Zeitstempel ---------- */
function sekunden(t){
  if (typeof t === "number") return Math.max(0, Math.round(t));
  return String(t || "0").split(":").map(Number).reduce((s, x) => s * 60 + (x || 0), 0);
}
function videoUrl(url, t){
  const s = sekunden(t);
  if (!s) return url;
  try {
    const u = new URL(url);
    if (/youtube\.com|youtu\.be/.test(u.hostname)){ u.searchParams.set("t", s + "s"); return u.toString(); }
    if (/vimeo\.com/.test(u.hostname)){ u.hash = "t=" + s + "s"; return u.toString(); }
    u.hash = "t=" + s;            /* Videodateien (.mp4) und viele Player, z. B. Opencast */
    return u.toString();
  } catch(e){ return url; }
}
function videoLinks(card){
  const list = [].concat(card.video || []).filter(v => v && v.url);
  if (!list.length) return "";
  return `<div class="vids">${list.map(v => `<a class="vid" href="${esc(videoUrl(v.url, v.t))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ ${esc(v.label || "Video")}${v.t ? " ab " + esc(v.t) : ""}</a>`).join("")}</div>`;
}

/* ---------- Auswahl nach Vorlesungsteil ---------- */
function teilOptionen(t, items){
  const ids = new Set(items.map(x => x.teil).filter(Boolean));
  const teile = (t.teile || []).filter(x => ids.has(x.id));
  return teile.length > 1 ? [{id: "alle", titel: "Alle"}, ...teile] : [];
}
function teilSeg(t, items, key, aktiv){
  const opt = teilOptionen(t, items);
  if (!opt.length) return "";
  return `<div class="seg teilseg" id="teilseg" role="group" aria-label="Vorlesungsteil">${opt.map(o =>
    `<button type="button" data-v="${o.id}" class="${o.id === aktiv ? "on" : ""}">${esc(o.titel)}</button>`).join("")}</div>`;
}
function teilAktiv(t, items, key){
  const v = store.get("teil-" + t.id + "-" + key, "alle");
  return teilOptionen(t, items).some(o => o.id === v) ? v : "alle";
}
function teilBind(el, t, key, cb){
  el.querySelectorAll("#teilseg button").forEach(b => b.onclick = () => { store.set("teil-" + t.id + "-" + key, b.dataset.v); cb(b.dataset.v); });
}
const imTeil = (x, v) => v === "alle" || x.teil === v;

/* ---------- Karteikarten (Leitner, 3 Fächer) ---------- */
function Karten(t, el){
  const key = "leitner2-" + t.id;
  let box = store.get(key, {});
  let teil = teilAktiv(t, t.karten, "karten");
  let deck, pos;
  const id = k => t.karten[k].v;
  const boxOf = k => box[id(k)] || 1;
  const pool = () => t.karten.map((_, k) => k).filter(k => imTeil(t.karten[k], teil));
  function build(onlyOpen){
    const idx = pool().filter(k => !onlyOpen || boxOf(k) < 3);
    deck = shuffle(idx).sort((a, b) => boxOf(a) - boxOf(b)); pos = 0; draw();
  }
  function counts(){ const c = [0,0,0]; pool().forEach(k => c[boxOf(k)-1]++); return c; }
  function head(){
    return teilSeg(t, t.karten, "karten", teil);
  }
  function bindHead(){ teilBind(el, t, "karten", v => { teil = v; build(false); }); }
  function draw(){
    const c = counts(), n = pool().length;
    if (pos >= deck.length){
      el.innerHTML = `<div class="cards-wrap">${head()}<div class="note">Durchgang fertig. ${c[2]} von ${n} Karten sitzen (Fach 3).</div>
        <div class="row"><button class="btn" id="open">Offene Karten wiederholen</button><button class="btn ghost" id="all">Alle Karten</button><button class="btn ghost" id="reset">Fächer zurücksetzen</button></div></div>`;
      $("#open").onclick = () => build(true); $("#all").onclick = () => build(false);
      $("#reset").onclick = () => { pool().forEach(k => delete box[id(k)]); store.set(key, box); build(false); };
      bindHead(); return;
    }
    const k = deck[pos], card = t.karten[k];
    const quelle = (t.teile || []).find(x => x.id === card.teil)?.quelle;
    el.innerHTML = `<div class="cards-wrap">${head()}
      <div class="row" style="justify-content:space-between"><span class="label">Karte ${pos+1} / ${deck.length}</span><span class="label">Fach ${boxOf(k)}</span></div>
      <div class="prog"><i style="width:${pos/deck.length*100}%"></i></div>
      <div class="flip" id="flip" tabindex="0" role="button" aria-label="Karte umdrehen">
        <div class="flip-in">
          <div class="face"><span class="label">${quelle ? esc(quelle) : "Begriff"}</span><h3>${esc(card.v)}</h3><span class="label">Tippen zum Umdrehen</span></div>
          <div class="face back"><span class="label">${esc(card.v)}</span><p>${esc(card.r)}</p>${videoLinks(card)}</div>
        </div></div>
      <div class="row" style="justify-content:center"><button class="btn bad" id="no">Nochmal</button><button class="btn good" id="yes">Gewusst</button></div>
      <div class="boxes"><span>Fach 1: ${c[0]}</span><span>Fach 2: ${c[1]}</span><span>Fach 3: ${c[2]}</span></div>
    </div>`;
    tex(el); bindHead(); const f = $("#flip"); f.onclick = () => f.classList.toggle("on");
    f.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); f.classList.toggle("on"); } };
    $("#yes").onclick = () => { box[id(k)] = Math.min(3, boxOf(k) + 1); store.set(key, box); pos++; draw(); };
    $("#no").onclick = () => { box[id(k)] = 1; store.set(key, box); pos++; draw(); };
  }
  build(false);
}

/* ---------- Mindmap ---------- */
function Mindmap(t, el){
  const node = n => n.c?.length
    ? `<li><details><summary>${esc(n.t)}</summary><ul>${n.c.map(node).join("")}</ul></details></li>`
    : `<li class="leaf">${esc(n.t)}</li>`;
  const m = t.mindmap;
  el.innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn ghost" id="openall">Alles aufklappen</button><button class="btn ghost" id="closeall">Alles zuklappen</button></div>
  <div class="mm mm-root"><div class="mm-center">${esc(m.t)}</div>
    <div class="mm-branches">${m.c.map(b => `<div class="mm-branch"><details open><summary>${esc(b.t)}</summary>
      ${b.c?.length ? `<ul>${b.c.map(node).join("")}</ul>` : ""}</details></div>`).join("")}</div></div>`;
  tex(el); $("#openall").onclick = () => el.querySelectorAll("details").forEach(d => d.open = true);
  $("#closeall").onclick = () => el.querySelectorAll(".mm-branch details details").forEach(d => d.open = false);
}

/* ---------- Formelsammlung ---------- */
function pdfUrl(datei){
  const lokal = location.protocol === "file:" || location.hostname.endsWith("github.io");
  return (lokal ? "" : (DATA.site || "")) + datei;
}
function pdfLinks(t, art){
  return (t.pdfs || []).filter(x => !art || x.art === art).map(x =>
    `<a class="btn ghost pdf" href="${esc(pdfUrl(x.datei))}" target="_blank" rel="noopener">${esc(x.titel)} als PDF</a>`).join("");
}
function formelGruppen(t){
  const teile = t.teile || [];
  const gruppen = teile.map(x => ({titel: x.titel, items: t.formeln.filter(f => f.teil === x.id)})).filter(g => g.items.length);
  const rest = t.formeln.filter(f => !teile.some(x => x.id === f.teil));
  if (rest.length) gruppen.push({titel: gruppen.length ? "Weitere" : "", items: rest});
  return gruppen;
}
function Formeln(t, el){
  el.innerHTML = `<div class="row" style="margin-bottom:14px">${pdfLinks(t, "formelsammlung")}</div>${formelGruppen(t).map(g => `
    ${g.titel ? `<h3 class="fgruppe">${esc(g.titel)}</h3>` : ""}<div class="formeln">${g.items.map(f => `
    <div class="formel"><h3>${f.gl ? `<span class="gl">(${esc(f.gl)})</span> ` : ""}${esc(f.name)}</h3><div class="f">$\displaystyle ${f.f}$</div><div class="e">${esc(f.e)}</div></div>`).join("")}</div>`).join("")}`; tex(el);
}

/* ---------- Zuordnen ---------- */
function Zuordnen(t, el){
  let left, right, sel = null, done = 0, fehler = 0, n = 0;
  let teil = teilAktiv(t, t.paare, "paare");
  function start(){
    const runde = shuffle(t.paare.map((p, k) => ({...p, k})).filter(p => imTeil(p, teil))).slice(0, 8);
    n = runde.length;
    left = shuffle(runde.map(p => ({k: p.k, s: p.a}))); right = shuffle(runde.map(p => ({k: p.k, s: p.b})));
    sel = null; done = 0; fehler = 0; draw();
  }
  function draw(){
    el.innerHTML = `${teilSeg(t, t.paare, "paare", teil)}<p class="note">Erst links einen Begriff antippen, dann rechts die passende Bedeutung. Jede Runde mischt bis zu 8 Paare neu. <span class="mono" id="stat">${done}/${n} · Fehler ${fehler}</span></p>
    <div class="match"><div class="col">${left.map(x => `<button class="mitem a" data-k="${x.k}">${esc(x.s)}</button>`).join("")}</div>
    <div class="col">${right.map(x => `<button class="mitem b" data-k="${x.k}">${esc(x.s)}</button>`).join("")}</div></div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="new">Neue Runde</button></div>`;
    teilBind(el, t, "paare", v => { teil = v; start(); });
    el.querySelectorAll(".mitem.a").forEach(b => b.onclick = () => { if (b.classList.contains("done")) return; el.querySelectorAll(".mitem.a").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.k; });
    el.querySelectorAll(".mitem.b").forEach(b => b.onclick = () => {
      if (sel === null || b.classList.contains("done")) return;
      if (+b.dataset.k === sel){
        b.classList.add("done"); b.disabled = true; const a = el.querySelector(`.mitem.a[data-k="${sel}"]`); a.classList.remove("sel"); a.classList.add("done"); a.disabled = true; done++; sel = null;
      } else { fehler++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); }
      $("#stat").textContent = `${done}/${n} · Fehler ${fehler}` + (done === n ? " · fertig" : "");
    });
    $("#new").onclick = start; tex(el);
  }
  start();
}

DATA.themen = DATA.basis.map(applyEdits);
